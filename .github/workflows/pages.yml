# Publica o kit (incluindo demo/) no GitHub Pages: /<repo>/demo/
# Requer: Settings → Pages → Source = "GitHub Actions" (a dona do repositório ativa uma vez).
name: Publicar demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testes do helper de armazenamento
        run: node --test tests/*.test.mjs
      - name: Conferir que o demo está em dia com os blocos
        run: |
          node scripts/gerar-demo.mjs
          git diff --exit-code -- demo/ || (echo "demo/ desatualizado: rode node scripts/gerar-demo.mjs e faça commit" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
